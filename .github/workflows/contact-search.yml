name: Weekly contact search

on:
  schedule:
    # Monday, 09:00 Moscow time (GitHub cron is UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: research
        type: choice
        options:
          - research
          - sync-approved
      mode:
        description: "Run mode"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      max_companies:
        description: "Maximum source deals"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-contact-search
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AMO_BASE_URL: ${{ secrets.AMO_BASE_URL }}
      AMO_ACCESS_TOKEN: ${{ secrets.AMO_ACCESS_TOKEN }}
      AMO_PIPELINE_ID: ${{ vars.AMO_PIPELINE_ID }}
      AMO_SOURCE_STATUS_ID: ${{ vars.AMO_SOURCE_STATUS_ID }}
      AMO_SUCCESS_STATUS_ID: ${{ vars.AMO_SUCCESS_STATUS_ID }}
      AMO_WRITE_MODE: ${{ vars.AMO_WRITE_MODE || 'enrich' }}
      AMO_OUTPUT_PIPELINE_ID: ${{ vars.AMO_OUTPUT_PIPELINE_ID }}
      AMO_OUTPUT_STATUS_ID: ${{ vars.AMO_OUTPUT_STATUS_ID }}
      AMO_COMPANY_WEBSITE_FIELD_ID: ${{ vars.AMO_COMPANY_WEBSITE_FIELD_ID }}
      AMO_CONTACT_POSITION_FIELD_ID: ${{ vars.AMO_CONTACT_POSITION_FIELD_ID }}
      CONTACT_SEARCH_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'research' }}
      CONTACT_SEARCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-approved' && 'apply' || github.event_name == 'workflow_dispatch' && inputs.mode || (vars.AUTO_APPLY == 'true' && 'apply' || 'dry-run') }}
      MAX_COMPANIES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_companies || vars.MAX_COMPANIES || '10' }}
      MAX_CONTACTS_PER_COMPANY: ${{ vars.MAX_CONTACTS_PER_COMPANY || '5' }}
      MAX_PAGES_PER_SITE: ${{ vars.MAX_PAGES_PER_SITE || '8' }}
      MIN_CONTACT_SCORE: ${{ vars.MIN_CONTACT_SCORE || '35' }}
      INCLUDE_GENERIC_EMAILS: ${{ vars.INCLUDE_GENERIC_EMAILS || 'true' }}
      CREATE_FOLLOW_UP_TASK: ${{ vars.CREATE_FOLLOW_UP_TASK || 'true' }}
      FOLLOW_UP_DAYS: ${{ vars.FOLLOW_UP_DAYS || '2' }}
      TARGET_ROLES: ${{ vars.TARGET_ROLES }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      HUNTER_VERIFY_EMAILS: ${{ vars.HUNTER_VERIFY_EMAILS || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Research and sync
        run: npm start
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-search-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90
