name: Daily contact intelligence

on:
  schedule:
    # Every day, 05:20 Moscow time (GitHub cron is UTC).
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: research
        type: choice
        options:
          - research
          - research-company
          - monitor-demand
          - sync-approved
      mode:
        description: "Run mode"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      max_companies:
        description: "Maximum source deals"
        required: true
        default: "10"
        type: string
      company_name:
        description: "Company name for research-company"
        required: false
        type: string
      company_website:
        description: "Optional company website"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-contact-intelligence
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AMO_BASE_URL: ${{ secrets.AMO_BASE_URL }}
      AMO_ACCESS_TOKEN: ${{ secrets.AMO_ACCESS_TOKEN }}
      AMO_PIPELINE_ID: ${{ vars.AMO_PIPELINE_ID }}
      AMO_SOURCE_STATUS_ID: ${{ vars.AMO_SOURCE_STATUS_ID }}
      AMO_SUCCESS_STATUS_ID: ${{ vars.AMO_SUCCESS_STATUS_ID }}
      AMO_WRITE_MODE: ${{ vars.AMO_WRITE_MODE || 'enrich' }}
      AMO_OUTPUT_PIPELINE_ID: ${{ vars.AMO_OUTPUT_PIPELINE_ID }}
      AMO_OUTPUT_STATUS_ID: ${{ vars.AMO_OUTPUT_STATUS_ID }}
      AMO_COMPANY_WEBSITE_FIELD_ID: ${{ vars.AMO_COMPANY_WEBSITE_FIELD_ID }}
      AMO_COMPANY_NAME_FIELD_ID: ${{ vars.AMO_COMPANY_NAME_FIELD_ID }}
      AMO_CONTACT_POSITION_FIELD_ID: ${{ vars.AMO_CONTACT_POSITION_FIELD_ID }}
      CONTACT_SEARCH_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'daily' }}
      CONTACT_SEARCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-approved' && 'apply' || github.event_name == 'workflow_dispatch' && inputs.mode || 'dry-run' }}
      MANUAL_COMPANY_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.company_name || '' }}
      MANUAL_COMPANY_WEBSITE: ${{ github.event_name == 'workflow_dispatch' && inputs.company_website || '' }}
      MAX_COMPANIES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_companies || vars.MAX_COMPANIES || '10' }}
      MAX_CONTACTS_PER_COMPANY: ${{ vars.MAX_CONTACTS_PER_COMPANY || '5' }}
      MAX_PAGES_PER_SITE: ${{ vars.MAX_PAGES_PER_SITE || '8' }}
      MIN_CONTACT_SCORE: ${{ vars.MIN_CONTACT_SCORE || '35' }}
      INCLUDE_GENERIC_EMAILS: ${{ vars.INCLUDE_GENERIC_EMAILS || 'true' }}
      CREATE_FOLLOW_UP_TASK: ${{ vars.CREATE_FOLLOW_UP_TASK || 'true' }}
      FOLLOW_UP_DAYS: ${{ vars.FOLLOW_UP_DAYS || '2' }}
      TARGET_ROLES: ${{ vars.TARGET_ROLES }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      HUNTER_VERIFY_EMAILS: ${{ vars.HUNTER_VERIFY_EMAILS || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      SEARXNG_INSTANCES: ${{ vars.SEARXNG_INSTANCES }}
      GITHUB_OSINT_TOKEN: ${{ github.token }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DEMAND_QUERY_BUDGET: ${{ vars.DEMAND_QUERY_BUDGET || '36' }}
      DEMAND_MAX_SIGNALS: ${{ vars.DEMAND_MAX_SIGNALS || '120' }}
      DEMAND_FEEDS: ${{ vars.DEMAND_FEEDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for selective JavaScript fallback
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Run contact intelligence
        run: npm start
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f reports/demand-latest.md ]; then
            cat reports/demand-latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-search-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90
