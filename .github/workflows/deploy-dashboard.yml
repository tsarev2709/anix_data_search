name: Deploy admin dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "supabase/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$NEXT_PUBLIC_SUPABASE_URL" && -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dashboard deployment skipped: add Cloudflare and Supabase repository secrets."
          fi
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        if: steps.config.outputs.enabled == 'true'
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        if: steps.config.outputs.enabled == 'true'
        working-directory: dashboard
        run: npm run build
      - name: Deploy Cloudflare Worker
        if: steps.config.outputs.enabled == 'true'
        working-directory: dashboard
        run: npx wrangler deploy --config dist/server/wrangler.json

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      DASHBOARD_ORIGINS: ${{ secrets.DASHBOARD_ORIGINS }}
      DASHBOARD_GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TELEGRAM_MONITOR_CHAT_ID: ${{ secrets.TELEGRAM_MONITOR_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROJECT_ID" && -n "$SUPABASE_DB_PASSWORD" && -n "$ADMIN_EMAILS" && -n "$DASHBOARD_ORIGINS" && -n "$DASHBOARD_GITHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase deployment skipped: add project credentials and dashboard access secrets."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.enabled == 'true'
        with:
          version: latest
      - name: Apply database migrations
        if: steps.config.outputs.enabled == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Configure authorization gateway
        if: steps.config.outputs.enabled == 'true'
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            ADMIN_EMAILS="$ADMIN_EMAILS" \
            DASHBOARD_ORIGINS="$DASHBOARD_ORIGINS" \
            GITHUB_ACTIONS_TOKEN="$DASHBOARD_GITHUB_TOKEN" \
            GITHUB_REPO="tsarev2709/anix_data_search" \
            AMO_CONFIGURED="true" \
            AUTO_APPLY="false"
          optional_secrets=()
          [[ -n "$TELEGRAM_WEBHOOK_SECRET" ]] && optional_secrets+=(TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET")
          [[ -n "$TELEGRAM_MONITOR_CHAT_ID" ]] && optional_secrets+=(TELEGRAM_MONITOR_CHAT_ID="$TELEGRAM_MONITOR_CHAT_ID")
          if (( ${#optional_secrets[@]} > 0 )); then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" "${optional_secrets[@]}"
          fi
      - name: Deploy authorization gateway
        if: steps.config.outputs.enabled == 'true'
        run: supabase functions deploy contact-search-admin --project-ref "$SUPABASE_PROJECT_ID"
      - name: Configure Telegram webhook
        if: steps.config.outputs.enabled == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_WEBHOOK_SECRET != ''
        shell: bash
        run: |
          webhook_url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/contact-search-admin/telegram-webhook"
          response=$(curl --fail-with-body --silent --show-error             --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"             --data-urlencode "url=${webhook_url}"             --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}"             --data-urlencode 'allowed_updates=["message","edited_message","channel_post","edited_channel_post"]')
          echo "$response" | jq -e '.ok == true' >/dev/null
          echo "::notice::Telegram webhook configured"
